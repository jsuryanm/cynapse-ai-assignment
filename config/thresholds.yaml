
# Stage 0:  Image quality (OpenCV)
quality:
  min_aspect_ratio: 1.3 # width/height ratio - a person crop is tall 
  min_width: 80
  min_height: 150 
  min_brightness: 15.0 # mean lumiance 0-255 reject near black 
  max_brightness: 240.0 # reject near white (whiteout/overexposed)
  min_blur_variance: 10.0  # laplacian variance - low = blurry 

# Stage 1: Person detection (YOLOv11m, COCO class 0)
person_detection: 
  min_confidence: 0.5 
  min_bbox_area_ratio: 0.4 # person_bbox_area/crop_area - filter out tiny people
  max_persons: 5 # too many overlapping detections likely noise

# Stage 2: Full body via Pose
pose: 
  keypoint_confidence: 0.5 # per-keypoint visibility threshold
  min_head_kpts: 1 # atleast 1 of {nose,eyes,ears}
  min_shoulder_kpts: 2 # both shoulders
  min_hip_kpts: 2 
  min_knee_kpts: 2 # both knees and ankles

# Stage 3: Face visibility (SRCFD via insightface)
face:
  min_detection_confidence: 0.6 
  min_face_area_ratio: 0.005 # face_bbox_area / crop_area filtering tiny faces 
  require_all_landmarks_in_bbox: true

# Stage 4: Age estimation (MiVOLO)
age: 
  min_age: 16 
  age_confidence: 0.5 

# Stage 5:  CLIP zero shot/manequinn filtering
clip_ad_filter:
  similarity_margin: 0.05     # real_score must beat ad_score by this margin
  real_person_prompts:
    - "a candid photograph of a person walking on the street"
    - "a snapshot of a pedestrian"
    - "a photo of a person in a public place"
    - "a street photograph of someone"
  ad_prompts:
    - "an advertisement photo of clothing"
    - "a mannequin in a store window display"
    - "a clothing product photograph on a hanger"
    - "a fashion magazine cover"
    - "a billboard advertisement with a person"

