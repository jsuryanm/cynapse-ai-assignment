
# Hardware/runtime settings 
runtime:
  device: "cuda"
  batch_size: 16
  num_workers: 2 

paths:
  data_dir: "data/raw"
  artifacts_dir: "artifacts"
  labels_dir: "data/labels"
  models_cache: "artifacts/models"

# models downloaded automatically by ultralytics,insightface,open-clip
models:  
  yolo_detection: "yolo11m.pt"
  yolo_pose: "yolo11m-pose.pt"
  face_detector: "buffalo_l"
  age_estimator: "iitolstykh/mivolo_v2"
  clip_model: "openai/clip-vit-base-patch32"


# pipeline behaviour
pipeline:
  save_rejected: true 
  save_visualizations: true 
  decisions_filename: "decisions.parquet"
  manifest_filename: "manifest.json"
