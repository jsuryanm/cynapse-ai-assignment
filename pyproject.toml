[project]
name = "cynapse-ai-assignment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "fastapi>=0.136.1",
    "insightface>=0.7.3",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "loguru>=0.7.3",
    "matplotlib>=3.10.9",
    "mlflow>=3.12.0",
    "mypy>=2.0.0",
    "notebook>=7.5.6",
    "numpy>=2.4.4",
    "onnxruntime-gpu>=1.26.0",
    "open-clip-torch>=3.3.0",
    "opencv-python-headless>=4.13.0.92",
    "pandas>=2.3.3",
    "pillow>=12.2.0",
    "pyarrow>=23.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "ruff>=0.15.12",
    "seaborn>=0.13.2",
    "streamlit>=1.57.0",
    "supervision>=0.28.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "tqdm>=4.67.3",
    "typer>=0.25.1",
    "ultralytics>=8.4.47",
    "uvicorn[standard]>=0.46.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]


[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128" }
]

torchvision = [
  { index = "pytorch-cu128" }
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
